services:
  - type: web
    name: peoplepay360-api
    env: node
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
# Render Free Postgres expires after 30 days. Use a free external Postgres
# provider such as Neon and paste its pooled DATABASE_URL into the service.
