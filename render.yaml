services:
  - type: web
    name: peoplepay360-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peoplepay360-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://your-frontend-url.vercel.app" # TO UPDATE
      # Redis URL must be provided from Upstash
      - key: REDIS_URL
        sync: false

databases:
  - name: peoplepay360-db
    plan: free
    region: ohio
